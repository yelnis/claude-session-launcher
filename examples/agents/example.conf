# launch_claude: one registered agent. Reference for every key.
#
# Install as:  ${XDG_CONFIG_HOME:-~/.config}/launch_claude/agents/<id>.conf
# The file name is the ID. Usually you do not write this file by hand:
# "launch_claude open / add / set" create and update it. Hand edits are fine,
# but comments are dropped the next time launch_claude rewrites the file.
#
# Variants for common cases are next to this file:
#   tmux-only.conf        no ttyd, port kept for "launch_claude ttyd <id>"
#   second-account.conf   another Claude account for this agent

[agent]

# Work directory (absolute path). Required.
dir = /home/you/projects/example

# 1: serve the session in the browser with ttyd. 0: tmux only.
ttyd = 1

# ttyd port. Chosen at registration and kept, so the URL stays the same.
# It may also be set while ttyd = 0: the port is then reserved and used by
# "launch_claude ttyd <id>" or when ttyd is turned on again.
port = 7700

# Conversation used by "launch_claude start":
#   new       a new conversation every time (default)
#   resume    the last conversation this agent started (a new one if there is none)
#   continue  the latest conversation in the directory, renamed to the ID
mode = new

# 1: started by "launch_claude start --autostart" (e.g. from cron @reboot).
autostart = 0

# CLAUDE_CONFIG_DIR for this agent only. Leave it out to use the global setting.
# claude_config_dir = ~/.claude-personal
