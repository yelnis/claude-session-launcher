# One registered agent. The file name is the ID:
#   ${XDG_CONFIG_HOME:-~/.config}/launch_claude/agents/<id>.conf
# Usually written by "launch_claude open/add/set". You can edit it by hand,
# but comments are dropped the next time launch_claude rewrites the file.

[agent]

# Work directory (absolute path).
dir = /home/you/projects/example

# 1: serve the session in the browser with ttyd. 0: tmux only.
ttyd = 1

# ttyd port. Chosen at registration and kept, so the URL stays the same.
# Leave it out when ttyd = 0.
port = 7700

# Conversation used by "launch_claude start":
#   new       a new conversation every time (default)
#   resume    the last conversation this agent started (a new one if there is none)
#   continue  the latest conversation in the directory, renamed to the ID
mode = new

# 1: started by "launch_claude start --autostart" (e.g. from cron @reboot).
autostart = 0
