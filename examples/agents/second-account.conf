# launch_claude: an agent that uses another Claude account.
#
# Same as:
#   launch_claude add personal --dir /home/you/projects/hobby \
#     --claude-config-dir ~/.claude-personal
#
# Claude Code keeps the login, settings and conversations of an account in its
# config directory. Giving an agent its own directory lets several accounts run
# side by side under one Linux user. Agents without this key use the global
# claude_config_dir (see config.example).
#
# Log in once before the first start, or the session stops at the login screen:
#   CLAUDE_CONFIG_DIR=~/.claude-personal claude auth login
#
# Conversations belong to the config directory: after changing it, "resume" and
# "continue" no longer find the conversations of the previous account.
#
# Every key is explained in example.conf.

[agent]
dir = /home/you/projects/hobby
ttyd = 1
port = 7702
mode = new
autostart = 0
claude_config_dir = ~/.claude-personal
