# launch_claude: an agent without ttyd that comes back after a reboot.
#
# Same as:
#   launch_claude add coder --dir /home/you/projects/app --without-ttyd --port 7701 \
#     --mode continue --autostart
#
# The session is reached through Remote Control or "tmux attach -t coder".
# When a browser terminal is needed for a while:
#   launch_claude ttyd coder          # opens on the reserved port below
#   launch_claude ttyd coder --off    # closes it; claude keeps running
#
# Every key is explained in example.conf.

[agent]
dir = /home/you/projects/app
ttyd = 0
port = 7701
mode = continue
autostart = 1
